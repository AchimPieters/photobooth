# Kopieer dit bestand naar .github/workflows/generate-license.yml
# in jouw PRIVÉ repository (bijv. photobooth-licenses).
#
# Voeg daarna het volgende secret toe in die repo:
#   Settings → Secrets → Actions → New repository secret
#   Naam : PB_LICENSE_PRIVATE_KEY
#   Waarde: (zie de privésleutel die bij de app-documentatie staat)

name: Genereer licentie

on:
  workflow_dispatch:
    inputs:
      licensee:
        description: 'Naam van de licentiehouder (klant of bedrijf)'
        required: true
        type: string
      expires:
        description: 'Vervaldatum — formaat YYYY-MM-DD'
        required: true
        type: string
        default: '2027-12-31'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Genereer licentiecode
        env:
          PB_LICENSE_PRIVATE_KEY: ${{ secrets.PB_LICENSE_PRIVATE_KEY }}
        run: node generate-license.js "${{ inputs.licensee }}" "${{ inputs.expires }}"
