name: Photobooth
options:
  bundleIdPrefix: nl.studiopieters
  groupSortPosition: top
  generateEmptyDirectories: true
  defaultConfig: Debug

# ─────────────────────────────────────────────
# Gedeelde build-instellingen voor alle targets
# ─────────────────────────────────────────────
settings:
  base:
    TARGETED_DEVICE_FAMILY: "2"        # iPad only
    ENABLE_BITCODE: NO
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    SUMUP_AFFILIATE_KEY: ""
    PHOTOBOOTH_PRICE: "3.00"
  configs:
    Debug:
      DEBUG_INFORMATION_FORMAT: dwarf
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      VALIDATE_PRODUCT: YES
      STRIP_INSTALLED_PRODUCT: YES

# Gedeeld Info.plist blok (DRY)
# Hergebruikt in beide app-targets via YAML anchors
.sharedInfoProperties: &sharedInfoProperties
  NSCameraUsageDescription: "Photobooth gebruikt de camera om foto's te maken voor jouw fotostrip."
  NSLocalNetworkUsageDescription: "Photobooth gebruikt het lokale netwerk om te printen via AirPrint."
  NSBonjourServices:
    - _ipp._tcp
    - _ipps._tcp
  CFBundleURLTypes:
    - CFBundleURLSchemes:
        - photobooth
      CFBundleURLName: nl.studiopieters.photobooth
  LSApplicationQueriesSchemes:
    - sumupmerchant
  SUMUP_AFFILIATE_KEY: "$(SUMUP_AFFILIATE_KEY)"
  PHOTOBOOTH_PRICE: "$(PHOTOBOOTH_PRICE)"
  UIStatusBarHidden: true
  UIRequiresFullScreen: true
  UISupportedInterfaceOrientations~ipad:
    - UIInterfaceOrientationPortrait
  UILaunchScreen: {}

targets:

  # ─────────────────────────────────────────────
  # PhotoboothLegacy — UIKit, iOS 12, iPad mini 2
  # ─────────────────────────────────────────────
  PhotoboothLegacy:
    type: application
    platform: iOS
    deploymentTarget: "12.0"
    info:
      path: PhotoboothLegacy/Info.plist
      properties:
        <<: *sharedInfoProperties
    sources:
      # Eigen UIKit bronbestanden
      - path: PhotoboothLegacy
        excludes:
          - "Info.plist"
          - "Assets.xcassets"
      # Gedeeld model (geen SwiftUI-dependency)
      - path: Photobooth/Models/PhotoboothSession.swift
    resources:
      - PhotoboothLegacy/Assets.xcassets
    settings:
      base:
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal   # iOS 12 — geen strict concurrency
        PRODUCT_BUNDLE_IDENTIFIER: nl.studiopieters.photobooth.legacy
        PRODUCT_NAME: Photobooth
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: PhotoboothLegacy/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""                # Vul jouw Team ID in

  # ─────────────────────────────────────────────
  # Photobooth — SwiftUI, iOS 17+  (voor later)
  # ─────────────────────────────────────────────
  Photobooth:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    info:
      path: Photobooth/Info.plist
      properties:
        <<: *sharedInfoProperties
    sources:
      - path: Photobooth
        excludes:
          - "Info.plist"
    resources:
      - Photobooth/Assets.xcassets
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        PRODUCT_BUNDLE_IDENTIFIER: nl.studiopieters.photobooth
        PRODUCT_NAME: Photobooth
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_FILE: Photobooth/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""

  # ─────────────────────────────────────────────
  # Tests (voor SwiftUI target)
  # ─────────────────────────────────────────────
  PhotoboothTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - PhotoboothTests
    dependencies:
      - target: Photobooth
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_BUNDLE_IDENTIFIER: nl.studiopieters.photobooth.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Photobooth.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Photobooth"
        BUNDLE_LOADER: "$(TEST_HOST)"

  PhotoboothUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - PhotoboothUITests
    dependencies:
      - target: Photobooth
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_BUNDLE_IDENTIFIER: nl.studiopieters.photobooth.uitests
        TEST_TARGET_NAME: Photobooth

  # ─────────────────────────────────────────────
  # Tests voor Legacy target
  # ─────────────────────────────────────────────
  PhotoboothLegacyTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "12.0"
    sources:
      - PhotoboothLegacyTests
    dependencies:
      - target: PhotoboothLegacy
    settings:
      base:
        SWIFT_VERSION: "5.0"
        PRODUCT_BUNDLE_IDENTIFIER: nl.studiopieters.photobooth.legacy.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Photobooth.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Photobooth"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  # Legacy scheme — gebruik dit voor iPad mini 2
  PhotoboothLegacy:
    build:
      targets:
        PhotoboothLegacy: all
        PhotoboothLegacyTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: PhotoboothLegacyTests
          parallelizable: true
          randomExecutionOrder: true
      coverageTargets:
        - PhotoboothLegacy
      gatherCoverageData: true
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  # SwiftUI scheme — voor toekomstige ontwikkeling
  Photobooth:
    build:
      targets:
        Photobooth: all
        PhotoboothTests: [test]
        PhotoboothUITests: [test]
    run:
      config: Debug
      environmentVariables:
        - variable: PHOTOBOOTH_PRICE
          value: "3.00"
          isEnabled: true
    test:
      config: Debug
      targets:
        - name: PhotoboothTests
          parallelizable: true
          randomExecutionOrder: true
        - name: PhotoboothUITests
      coverageTargets:
        - Photobooth
      gatherCoverageData: true
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
