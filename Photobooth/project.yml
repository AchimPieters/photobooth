name: Photobooth
options:
  bundleIdPrefix: nl.studiopieters
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  groupSortPosition: top
  generateEmptyDirectories: true
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "2"          # iPad only
    ENABLE_BITCODE: NO
    SWIFT_STRICT_CONCURRENCY: complete
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    # Secrets injected via CI environment or local .xcconfig
    SUMUP_AFFILIATE_KEY: ""
    PHOTOBOOTH_PRICE: "3.00"
  configs:
    Debug:
      DEBUG_INFORMATION_FORMAT: dwarf
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      VALIDATE_PRODUCT: YES
      STRIP_INSTALLED_PRODUCT: YES

targets:
  Photobooth:
    type: application
    platform: iOS
    info:
      path: Photobooth/Info.plist
      properties:
        # Camera
        NSCameraUsageDescription: "Photobooth gebruikt de camera om foto's te maken voor jouw fotostrip."
        # AirPrint / lokaal netwerk
        NSLocalNetworkUsageDescription: "Photobooth gebruikt het lokale netwerk om te printen via AirPrint."
        NSBonjourServices:
          - _ipp._tcp
          - _ipps._tcp
        # SumUp callback URL scheme
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - photobooth
            CFBundleURLName: nl.studiopieters.photobooth
        # Toestemming om SumUp app te openen
        LSApplicationQueriesSchemes:
          - sumupmerchant
        # Productie-configuratie (worden ingevuld via xcconfig / CI secrets)
        SUMUP_AFFILIATE_KEY: "$(SUMUP_AFFILIATE_KEY)"
        PHOTOBOOTH_PRICE: "$(PHOTOBOOTH_PRICE)"
        # UI: volledig scherm, portrait-only, geen statusbar
        UIStatusBarHidden: true
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
        UILaunchScreen: {}
    sources:
      - path: Photobooth
        excludes:
          - "Info.plist"
    resources:
      - Photobooth/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.studiopieters.photobooth
        PRODUCT_NAME: Photobooth
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_FILE: Photobooth/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""           # Fill in your Team ID

  PhotoboothTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PhotoboothTests
    dependencies:
      - target: Photobooth
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.studiopieters.photobooth.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Photobooth.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Photobooth"
        BUNDLE_LOADER: "$(TEST_HOST)"

  PhotoboothUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - PhotoboothUITests
    dependencies:
      - target: Photobooth
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.studiopieters.photobooth.uitests
        TEST_TARGET_NAME: Photobooth

schemes:
  Photobooth:
    build:
      targets:
        Photobooth: all
        PhotoboothTests: [test]
        PhotoboothUITests: [test]
    run:
      config: Debug
      environmentVariables:
        - variable: PHOTOBOOTH_PRICE
          value: "3.00"
          isEnabled: true
    test:
      config: Debug
      targets:
        - name: PhotoboothTests
          parallelizable: true
          randomExecutionOrder: true
        - name: PhotoboothUITests
      coverageTargets:
        - Photobooth
      gatherCoverageData: true
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
