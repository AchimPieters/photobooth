name: CI

on:
  push:
    branches: [main, develop, feature/uikit-ios12]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: Photobooth/Photobooth.xcodeproj
  SCHEME: Photobooth
  # Pas de OS-versie aan naar de iOS-versie die de gekozen macos-runner ondersteunt.
  # macos-15 + Xcode 16.x → iOS 18.x simulators beschikbaar via `xcrun simctl list`
  DESTINATION: "platform=iOS Simulator,name=iPad mini (6th generation),OS=18.4"

jobs:
  # ──────────────────────────────────────────────
  # 1. Lint & build check (fast feedback)
  # ──────────────────────────────────────────────
  build:
    name: Build (Debug)
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: Photobooth
        run: xcodegen generate

      - name: Resolve package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT" \
            -scheme "$SCHEME" || true

      - name: Build for simulator
        run: |
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color

  # ──────────────────────────────────────────────
  # 2. Unit tests + coverage
  # ──────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: macos-15
    timeout-minutes: 20
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: Photobooth
        run: xcodegen generate

      - name: Run unit tests
        run: |
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -only-testing:PhotoboothTests \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults/unit.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color --report junit --output TestResults/unit-results.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: TestResults/

      - name: Upload xcresult
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-xcresult
          path: TestResults/unit.xcresult

  # ──────────────────────────────────────────────
  # 3. UI tests
  # ──────────────────────────────────────────────
  ui-tests:
    name: UI Tests
    runs-on: macos-15
    timeout-minutes: 30
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: Photobooth
        run: xcodegen generate

      - name: Run UI tests
        run: |
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -only-testing:PhotoboothUITests \
            -resultBundlePath TestResults/ui.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color --report junit --output TestResults/ui-results.xml

      - name: Upload UI test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-test-results
          path: TestResults/

  # ──────────────────────────────────────────────
  # 4. Legacy (UIKit/iOS12) unit tests
  # ──────────────────────────────────────────────
  legacy-tests:
    name: Legacy Unit Tests (iOS 12 / UIKit)
    runs-on: macos-15
    timeout-minutes: 20
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: Photobooth
        run: xcodegen generate

      - name: Run Legacy unit tests
        run: |
          xcodebuild test \
            -project "$PROJECT" \
            -scheme PhotoboothLegacy \
            -destination "platform=iOS Simulator,name=iPad (9th generation),OS=16.4" \
            -only-testing:PhotoboothLegacyTests \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults/legacy.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color --report junit --output TestResults/legacy-results.xml

      - name: Upload legacy test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-test-results
          path: TestResults/

  # ──────────────────────────────────────────────
  # 5. Archive (release build) — alleen op main
  # ──────────────────────────────────────────────
  archive:
    name: Archive (Release)
    runs-on: macos-15
    timeout-minutes: 30
    needs: [unit-tests, ui-tests, legacy-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: Photobooth
        run: xcodegen generate

      - name: Archive
        run: |
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath Archives/Photobooth.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            SKIP_INSTALL=NO \
            | xcpretty --color

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: Photobooth-archive
          path: Archives/Photobooth.xcarchive
          retention-days: 30
