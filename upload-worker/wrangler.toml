name = "photobooth-photos"
main = "worker.js"
compatibility_date = "2024-11-01"

# R2-bucket waar de foto's tijdelijk worden bewaard.
# Maak 'm eerst aan:  wrangler r2 bucket create photobooth-photos
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "photobooth-photos"

# Uurlijkse cron-sweep die verlopen foto's verwijdert (ook nooit-opgevraagde).
[triggers]
crons = ["0 * * * *"]

[vars]
# Bewaartijd in uren; daarna verwijdert de Worker de foto (bij opvragen + cron).
RETENTION_HOURS = "24"

# Origins die het upload-endpoint vanuit een browser mogen aanspreken
# (comma-gescheiden). Zet hier je eigen host als je niet op GitHub Pages draait.
ALLOWED_ORIGINS = "https://achimpieters.github.io"

# UPLOAD_KEY is een VERPLICHTE SECRET (niet hier invullen):
#   wrangler secret put UPLOAD_KEY
# Zonder deze secret weigert de Worker uploads (503). Zet dezelfde waarde in de
# admin onder "Upload-sleutel".
